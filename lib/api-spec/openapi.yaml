openapi: 3.1.0
info:
  title: Api
  version: 0.2.0
  description: Sercovir Geopolitical Intelligence Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: countries
  - name: conflicts
  - name: committees
  - name: resolutions
  - name: alliances
  - name: intelligence
  - name: delegates
  - name: leaders
