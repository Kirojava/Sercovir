kind = "web"
previewPath = "/"
title = "Sercovir"
version = "1.0.0"
id = "artifacts/sercovir"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20516

[services.development]
run = "pnpm --filter @workspace/sercovir run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/sercovir", "run", "build" ]
publicDir = "artifacts/sercovir/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20516"
BASE_PATH = "/"
